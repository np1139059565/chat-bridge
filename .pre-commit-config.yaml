# pre-commit 钩子配置
#
# 设计取舍：全部使用本地钩子（repo: local），不依赖任何远程仓库。
# 原因：本工程未提供 requirements-dev.txt / package.json，无法保证 CI 或
# 新克隆的机器能联网拉取远程钩子；本地钩子只依赖本机已有的 python 与 node，
# 缺失时自动跳过，不会把环境问题误报成代码问题。
#
# 钩子清单：
#   1. syntax     —— 校验本次改动文件的语法（py / js / json / yaml）
#   2. hygiene    —— 拦截临时备份文件与超过 450 行的源码（与拆分约定一致）
#   3. quality    —— 结构质量九项检查（参数 / 嵌套 / 长行 / 文件复杂度 / 函数个数 /
#                    JS 函数体 / 注释率 / 循环导入 / 命名），全量扫描
#
# 安装（每台机器执行一次）：
#   pre-commit install
# 手动全量运行：
#   pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: syntax
        name: 语法校验（py / js / json / yaml）
        description: 对本次提交涉及的文件做基础语法校验
        entry: python scripts/hooks/check_syntax.py
        language: system
        pass_filenames: true
        types_or: [python, javascript, json, yaml]

      - id: hygiene
        name: 仓库卫生（临时文件 / 超大文件）
        description: 拦截 *.bak 等临时残留，以及超过 450 行的源码文件
        entry: python scripts/hooks/check_hygiene.py
        language: system
        pass_filenames: true

      - id: quality
        name: 结构质量（九项检查）
        description: 函数参数 / 嵌套 / 单行 / 文件复杂度 / 函数个数 / JS 函数体 / 注释率 / 循环导入 / 命名
        entry: python scripts/quality_rules.py
        language: system
        pass_filenames: false
        always_run: true

      - id: doc-sync
        name: 文档同步（路由 / 工具收录）
        description: 校验路由与内置工具是否都已收录进 docs/api-reference.md，防止文档漂移
        entry: python scripts/check_doc_sync.py
        language: system
        pass_filenames: false
        always_run: true

      - id: js-tests
        name: 前端逻辑测试（node --test）
        description: 运行 flask_server/tests/js 下的前端纯逻辑测试；无 node 时跳过
        entry: python scripts/hooks/check_js_tests.py
        language: system
        pass_filenames: false
        always_run: true
