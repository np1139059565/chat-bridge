name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  python-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: 运行 Python 单元/API 测试
        run: |
          python -m pytest tests/ -x --ignore=tests/e2e \
            --cov=flask_server \
            --cov-fail-under=80 \
            --cov-report=term-missing \
            --cov-report=xml
      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml

  e2e-tests:
    runs-on: ubuntu-latest
    needs: python-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: 安装 Playwright 浏览器
        run: |
          python -m playwright install chromium
      - name: 安装 JS 依赖
        run: |
          npm install
      - name: 运行 e2e 测试（含 JS 覆盖率）
        env:
          CB_TEST_PORT: '5000'
        run: |
          python -m pytest tests/e2e/ -v --tb=short
      - name: 上传 e2e 报告与快照
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            tests/e2e/artifacts/
            tests/e2e/snapshots/

  stylelint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 安装 JS 依赖
        run: npm install
      - name: 运行 stylelint
        run: npx stylelint "chrome extension/dialog/style.css"
