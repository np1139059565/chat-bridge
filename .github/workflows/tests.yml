name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  python-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r flask_server/requirements.txt
      - name: 运行 Python 单元测试
        # 测试位于 flask_server/tests/，用标准库 unittest 编写。
        # 以 flask_server 为工作目录运行，使被测模块可直接 import。
        working-directory: flask_server
        run: |
          python -m unittest discover -s tests -v

  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 结构质量检查（十二项，与提交钩子同一入口）
        # 与 pre-commit 的 quality 钩子跑同一个脚本，规则只有一份。
        # 存量违规已登记进 scripts/quality_baseline.json，只有新增违规才会失败——
        # 因此这里不需要 continue-on-error：绿就是真绿，红就是真有新增问题。
        run: python scripts/quality_rules.py
