name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  python-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r flask_server/requirements.txt
      - name: 运行 Python 单元测试
        # 测试位于 flask_server/tests/，用标准库 unittest 编写。
        # 以 flask_server 为工作目录运行，使被测模块可直接 import。
        working-directory: flask_server
        run: |
          python -m unittest discover -s tests -v

  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 代码质量扫描（行数 / 圈复杂度 / 重复块）
        # 当前仍有存量超标项（见 docs/refactor-plan.md 批次 3），
        # 先以「不阻断构建」的方式接入，待批次 3 完成后再去掉 continue-on-error。
        continue-on-error: true
        run: python scripts/check_quality.py
