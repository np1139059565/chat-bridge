<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Mock DeepSeek Chat</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #f9f9f9; }
    .ds-virtual-list-visible-items {
      max-width: 800px; margin: 20px auto; padding: 16px;
    }
    .ds-message {
      border: 1px solid #ddd; border-radius: 8px;
      margin-bottom: 16px; padding: 12px; background: #fff;
    }
    .ds-collapsible-text { margin: 4px 0; }
    .ds-markdown.ds-assistant-message-main-content { margin-top: 8px; }
    .ds-think-content { color: #999; font-style: italic; border-left: 3px solid #ccc; padding-left: 8px; }
    .ds-scroll-area { display: none; }
    div.language[lang] { background: #1e1e1e; color: #d4d4d4; border-radius: 6px; padding: 8px; overflow-x: auto; }
    div.language[lang] pre { margin: 0; }
    div.language[lang] code { font-family: monospace; font-size: 13px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="ds-virtual-list-visible-items" id="chat-container">
    <div class="ds-message">
      <div class="ds-collapsible-text"><p>请搜索内容</p></div>
    </div>
    <div class="ds-message">
      <div class="ds-think-content">用户可能想搜索文件内容。</div>
      <div class="ds-markdown ds-assistant-message-main-content">
        <p>我来搜索。</p>
        <div class="language language-tool" lang="tool">
          <pre class="hljs"><code>{
  "project": "bridge-tool",
  "tool": "search_content",
  "parameters": {
    "pattern": "Flask",
    "path": "flask_server",
    "glob": "*.py"
  }
}</code></pre>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
