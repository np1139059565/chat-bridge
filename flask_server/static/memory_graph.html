<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>记忆图谱</title>
  <style>
    /* 记忆图谱样式：暗色底，节点按分级着色，突触边虚线 */
    html, body { margin: 0; padding: 0; height: 100%; background: #14161a; color: #d8dbe0; font-family: system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    #bar {
      flex: 0 0 auto; padding: 8px 12px; background: #1c1f25;
      display: flex; gap: 10px; align-items: center; font-size: 13px; flex-wrap: wrap;
    }
    #bar select, #bar input { background: #262a31; border: 1px solid #333; color: #d8dbe0; padding: 4px 8px; border-radius: 4px; }
    #bar button { background: #2d6cdf; border: 0; color: #fff; padding: 5px 12px; border-radius: 4px; cursor: pointer; }
    #bar button.ghost { background: #333a44; }
    #bar label { user-select: none; cursor: pointer; }
    #legend { margin-left: auto; display: flex; gap: 10px; font-size: 12px; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
    #cv { flex: 1 1 auto; display: block; width: 100%; }
    #tip {
      position: fixed; pointer-events: none; background: #000c;
      padding: 6px 10px; border-radius: 4px; font-size: 12px;
      max-width: 320px; display: none;
    }
    /* 详情弹框 */
    #detail {
      position: fixed; inset: 0; background: #000a; display: none; z-index: 10;
      align-items: center; justify-content: center;
    }
    #detailBody {
      background: #1c1f25; border: 1px solid #333; border-radius: 8px;
      padding: 16px; width: 640px; max-width: 92vw; max-height: 88vh; overflow: auto;
    }
    .dt-row { margin: 8px 0; font-size: 13px; }
    .dt-in { width: 100%; background: #262a31; border: 1px solid #333; color: #d8dbe0; padding: 5px; border-radius: 4px; }
    .dt-ta {
      width: 100%; height: 90px; background: #262a31; border: 1px solid #333;
      color: #d8dbe0; padding: 6px; border-radius: 4px; font-size: 12px; resize: vertical;
    }
    .dt-actions { margin-top: 12px; display: flex; gap: 8px; }
    .dt-actions button { background: #2d6cdf; border: 0; color: #fff; padding: 6px 14px; border-radius: 4px; cursor: pointer; }
    .dt-actions button.ghost { background: #333a44; }
    .dt-actions button.danger { background: #b33; }
  </style>
</head>
<body>
  <div id="bar">
    <select id="conv"><option value="">（全部会话）</option></select>
    <button id="reload">加载</button>
    <input id="search" placeholder="搜索关键词/精华" style="width:150px" />
    <button id="modeForce" class="ghost">力导向图</button>
    <button id="modeRadial" class="ghost">径向树</button>
    <button id="modeTimeline" class="ghost">时间轴</button>
    <input id="rootId" placeholder="根节点 id（径向树用）" style="width:180px" />
    <label><input type="checkbox" id="edge-parent_child" checked /> 树边</label>
    <label><input type="checkbox" id="edge-branch" checked /> 分支边</label>
    <label><input type="checkbox" id="edge-associative" checked /> 突触边</label>
    <span id="stat"></span>
    <div id="legend">
      <span><i class="dot" style="background:#888"></i>临时</span>
      <span><i class="dot" style="background:#3a8dde"></i>中期</span>
      <span><i class="dot" style="background:#e0b23a"></i>永久</span>
      <span><i class="dot" style="background:#e05a5a"></i>用户</span>
    </div>
  </div>
  <canvas id="cv"></canvas>
  <div id="tip"></div>
  <div id="detail"><div id="detailBody"></div></div>
  <!-- 脚本按依赖顺序加载：核心 → 绘制 → 交互 → 数据 → 入口 -->
  <script src="/memory-graph-assets/mg_core.js"></script>
  <script src="/memory-graph-assets/mg_render.js"></script>
  <script src="/memory-graph-assets/mg_interact.js"></script>
  <script src="/memory-graph-assets/mg_data.js"></script>
  <script src="/memory-graph-assets/mg_main.js"></script>
</body>
</html>
