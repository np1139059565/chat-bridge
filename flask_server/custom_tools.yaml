# AI 工具调用镜像 · 自定义工具（由标准 skill 安装）
# 本文件由插件自动维护；建议通过设置页修改，手工编辑请严格保持缩进。
tools:
  - name: "json_validate"
    description: "校验并格式化 JSON 文本：返回美化后的 JSON；非法 JSON 返回错误。用于核对 AI 生成的 JSON 片段。"
    skill_name: "json_tool"
    skill_dir: "skills\\json_tool"
    script: "scripts/json_validate.py"
    interpreter: "python"
    arg_style: "flag"
    enabled: false
    parameters:
      - name: "text"
        type: "string"
        required: true
        description: "待校验的 JSON 文本"
      - name: "indent"
        type: "number"
        required: false
        description: "缩进空格数，默认 2"
      - name: "sort_keys"
        type: "boolean"
        required: false
        description: "是否按 key 排序"
  - name: "get_element_style"
    description: "按选择器采集元素样式与 DOM 信息"
    skill_name: "debug_chrome"
    skill_prompt: "本技能提供页面探查能力，相关工具通过「外部调试卡片」与调试扩展交互。当收到 type=debug-chrome-req 的消息时，属于外部调试卡片任务。处理要求：若本次会话尚未阅读过本技能说明，请先读取 skills/debug_chrome/SKILL.md，再按其规定处理；同一会话内只需读取一次；完成后按 SKILL.md 规定的结构回复。"
    skill_dir: "skills\\debug_chrome"
    arg_style: "flag"
    executor: "external"
    provider: "debug_chrome"
    enabled: true
    parameters:
      - name: "selector"
        type: "string"
        required: true
        description: "CSS 选择器"
