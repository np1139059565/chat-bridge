      label: Perplexity
      newConversation: ''
      sendButton: button[aria-label="提交"]
      split: false
      userContent: '[class*="whitespace-pre-wrap"]'
    qianwen:
      assistantContent: .qk-markdown
      assistantItem: .chat-answers-card-wrap
      container: '[class*=message-list-content-container]'
