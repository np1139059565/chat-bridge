      push_message 工具主动向用户推送进度、方案与结论。
    skill_dir: skills\debug_chrome
    script: ''
    interpreter: ''
    arg_style: flag
    fixed_args: []
    parameters:
    - name: page_url
      type: string
      required: false
      description: 目标页面 URL
    executor: external
    provider: debug_chrome
    silent: false
    wakeup: false
    kind: tool
    enabled: true
bridge:
  intents: 0
  command_params:
    md:
      selector: .ds-virtual-list--printable .ds-virtual-list-visible-items > div:last-child
        div[role="button"]:has(.ds-cross-fade)
  commands:
  - name: /new
    label: 开启新对话
    selector: '@profile:newConversation'
    page_url: ''
  - name: /crp
    label: 清空消息记录并重新解析
    steps:
    - /cms
    - /rp
    interval: 1
  - name: /rall
    label: 重启前后端并刷新
    steps:
    - /rf
    - /sa on
    - /dc
    - /rs
    interval: 6
  - name: /reai
    label: 重新生成
    selector: document.querySelector('.ds-virtual-list--printable .ds-virtual-list-visible-items
      > div:last-child [role="button"][aria-disabled="false"]')
    page_url: ''
  - name: /reai1
    label: 消息频繁失败后重发
    selector: Array.from(document.querySelectorAll("div.ds-button.ds-button--warning:nth-child(3)")).reverse()[0]
    page_url: ''
