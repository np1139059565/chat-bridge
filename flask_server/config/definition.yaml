app:
  flask:
    host: 0.0.0.0
  limits:
    max_json_chars: 100000
  default_profile: glm
  site_profiles:
    chatglm.cn: glm
    chatglm.com: glm
    deepseek.com: deepseek
    wenxin.baidu.com: wenxin
  profiles:
    deepseek:
      assistantContent: .ds-markdown.ds-assistant-message-main-content
      assistantMark: .ds-assistant-message-main-content
      container: .ds-virtual-list-visible-items
      convIdUrl: \/a\/chat\/s\/([^/?#]+)
      historyContainer: .ds-scroll-area
      historyItem: a[href*="/a/chat/s/"]
      historySelectedMark: ''
      hosts:
      - deepseek.com
      inputSelector: textarea._27c9245, textarea[name="search"]
      item: .ds-message
      label: DeepSeek
      newConversation: div._5a8ac7a.a084f19e
      regenerateExpr: document.querySelector('.ds-virtual-list--printable .ds-virtual-list-visible-items
        > div:last-child [role="button"][aria-disabled="false"]')
      retrySendExpr: (function(){var a=document.querySelectorAll("div.ds-button.ds-button--warning:nth-child(3)");return
        a.length?a[a.length-1]:null;})()
      scrollToBottomButton:
      - div[role="button"].ds-button--circle.ds-button--outlinedNeutral.ds-button--floating
      sendButton: div[role="button"].ds-button--primary.ds-button--circle
      sendButtonDisabledMark: ds-button--disabled
      sendButtonStopMark: M2 4.88C2 3.68009
      split: false
      thinking: .ds-think-content
      userContent: .ds-collapsible-text
    glm:
      answerContent: .answer-content
      answerWrap: .answer-content-wrap
      assistantItem: .answer, [id^="row-answer"]
      assistantName: .assistant-name
      container: .detail.chatScrollContainer.conversation-list
      convIdUrl: '[?&]cid=([^&]+)'
      generatingSelectors:
      - .enter.is-main-chat.m-three-row
      - .enter.is-main-chat.searching
      historyContainer: aside.aside-container, .aside-container
      historyItem: .history-item
      historySelectedMark: .selected
      hosts:
      - chatglm.cn
      - chatglm.com
      inputSelector: '#search-input-box textarea, textarea.scroll-display-none'
      item: .conversation-item
      label: 智谱清言 GLM
      newConversation: '#app > section > aside > div.aside-subjects > div.new-session.flex.flex-x-start.flex-y-center.el-tooltip__trigger.el-tooltip__trigger'
      split: true
      thinking: .advance-thinking
      thinkingArea: .advance-thinking-area
      userContent: .question-txt
      userItem: .conversation.question, .question, [id^="row-question"]
      userName: .user-name
    qianwen:
      assistantContent: .qk-markdown
      assistantItem: .chat-answers-card-wrap
      container: '[class*=message-list-content-container]'
      convIdUrl: \/chat\/([0-9a-zA-Z]+)
      generatingSelectors:
      - button[aria-label="停止回答"]
      historyContainer: '[class*=sider-scrollbar], aside'
      historyItem: .sider-scrollbar [class*="cursor-pointer"][class*="rounded-8"]
      historySelectedMark: ''
      hosts:
      - qianwen.com
      inputSelector: div[contenteditable="true"][role="textbox"]
      item: .chat-round
      label: 通义千问
      newConversation: '#new-nav-tab-wrapper > div > div > div.relative.flex.min-h-0.flex-1.flex-col
        > div > div.relative.grid.min-h-0.min-w-0.flex-1.grid-cols-\[minmax\(0\,1fr\)\].grid-rows-\[minmax\(0\,1fr\)\].overflow-hidden
        > div > div.newChatReveal-OikAdB.newChatRevealFlat-hnO8At > div > div > div
        > div'
      sendButton: button[aria-label="发送消息"]
      split: true
      userContent: .question-text-card
      userItem: .chat-question-wrap
    wenxin:
      answerWrap: .ai-entry-block.ai-markdown
      assistantItem: .conversation-flow-answer-container
      container: .conversation-flow-content
      convIdUrl: \/search\/([0-9]+)
      generatingSelectors:
      - '[class*="_stop_"]'
      hosts:
      - wenxin.baidu.com
      inputSelector: '#chat-textarea, textarea.ci-textarea'
      item: .chat-qa-container
      label: 文心一言
      newConversation: ''
      scrollToBottomButton:
      - div.cs-scroll-to-bottom-btn
      sendButton: '#ci-submit-button-ai, .ci-submit-button'
      split: true
      thinking: '[class*=ai-thinking-steps]'
      userContent: .cs-question-pure-text
      userItem: .conversation-flow-question-container
    xinghuo:
      assistantContent: '[class*="task-helper-content_bubble"]'
      assistantItem: '[class*="task-helper-content_message_item"][class*="task-helper-content_assistant"]'
      container: '#chat-content-wrapper'
      convIdUrl: '[?&]chatId=([0-9]+)'
      hosts:
      - xinghuo.xfyun.cn
      inputSelector: div[contenteditable="true"][class*=WorkSkillEditor_editor]
      item: '[class*="task-helper-content_turn__"]'
      label: 讯飞星火
      newConversation: '[class*=LeftSideExpand_new_chat_wrap]'
      sendButton: '[class*=AskWindow_send]'
      split: true
      thinking: '[class*="task-helper-content_reasoning_block"]'
      userContent: '[class*="task-helper-content_bubble"]'
      userItem: '[class*="task-helper-content_user__"]'
    yuanbao:
      assistantContent: .hyc-common-markdown
      assistantMark: .agent-chat__bubble--ai
      container: .agent-chat__list__content
      convIdUrl: /chat/([A-Za-z0-9]+)
      hosts:
      - yuanbao.tencent.com
      inputSelector: .ql-editor
      item: .agent-chat__bubble
      label: 腾讯元宝
      newConversation: .yb-new-chat-entry__item
      sendButton: '[class*=SendButton_sendButton]'
      sendButtonDisabledMark: SendButton_disabled
      split: false
      userContent: .agent-chat__bubble__content
      scrollToBottomButton:
      - '#chat-content > div > div.agent-chat__list__content-wrapper > div.agent-chat__scroll-arrow.agent-chat__scroll-arrow--show'
    kimi:
      answerWrap: .markdown
      assistantMark: .chat-content-item-assistant
      container: .chat-content-list
      convIdUrl: /chat/([0-9a-zA-Z-]+)
      hosts:
      - www.kimi.com
      - kimi.com
      inputSelector: .chat-input-editor
      item: '[class*=chat-content-item]'
      label: Kimi
      newConversation: .new-chat-btn
      sendButton: .send-button-container
      sendButtonDisabledMark: disabled
      split: false
      thinking: '[class*=thinking-container]'
      userContent: .segment-container
custom_tools:
  tools:
  - name: json_validate
    description: 校验并格式化 JSON 文本：返回美化后的 JSON；非法 JSON 返回错误。用于核对 AI 生成的 JSON 片段。
    skill_name: json_tool
    skill_dir: skills\json_tool
    script: scripts/json_validate.py
    interpreter: python
    arg_style: flag
    enabled: true
    parameters:
    - name: text
      type: string
      required: true
      description: 待校验的 JSON 文本
    - name: indent
      type: number
      required: false
      description: 缩进空格数，默认 2
    - name: sort_keys
      type: boolean
      required: false
      description: 是否按 key 排序
  - name: get_element_style
    description: 按选择器采集元素样式与 DOM 信息。
    skill_name: debug_chrome
    skill_prompt: 本技能提供页面探查与调试能力（采集元素样式、截图、读取 console 与 network 记录、执行 JS），相关工具通过「外部调试卡片」与调试扩展交互。处理要求：若本次会话尚未阅读过本技能说明，请先用
      read_skill 工具读取（skill=debug_chrome, file=SKILL.md），再按其规定处理；同一会话内只需读取一次；处理过程中用
      push_message 工具主动向用户推送进度、方案与结论。
    skill_dir: skills\debug_chrome
    arg_style: flag
    executor: external
    provider: debug_chrome
    enabled: true
    parameters:
    - name: selector
      type: string
      required: true
      description: CSS 选择器
    - name: page_url
      type: string
      required: true
      description: 目标页面的 URL
    - name: properties
      type: array
      required: false
      description: 只采集这些 CSS 属性（如 ["color","font-size"]）；省略则返回常用属性集
    - name: include_all
      type: boolean
      required: false
      description: 是否返回全量计算样式（默认 false，返回常用属性）
  - name: push_message
    description: 向调试扩展抽屉推送一条文字信息
    skill_name: debug_chrome
    skill_prompt: 本技能提供页面探查与调试能力（采集元素样式、截图、读取 console 与 network 记录、执行 JS），相关工具通过「外部调试卡片」与调试扩展交互。处理要求：若本次会话尚未阅读过本技能说明，请先用
      read_skill 工具读取（skill=debug_chrome, file=SKILL.md），再按其规定处理；同一会话内只需读取一次；处理过程中用
      push_message 工具主动向用户推送进度、方案与结论。
    skill_dir: skills\debug_chrome
    arg_style: flag
    executor: external
    provider: debug_chrome
    silent: true
    enabled: true
    parameters:
    - name: message
      type: string
      required: true
      description: 推送正文
    - name: title
      type: string
      required: false
      description: 可选标题
    - name: no_reply
      type: boolean
      required: true
      description: 为 true 时不回传执行结果，仅执行推送。用于最后一次总结性推送，避免结果回传再次唤醒 AI
